name: Authorize release promotion

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: authorize-release-main
  cancel-in-progress: false

jobs:
  authorize:
    name: authorize-release
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      intent: ${{ steps.contract.outputs.intent }}
      should-release: ${{ steps.contract.outputs.should_release }}
      tag: ${{ steps.contract.outputs.tag }}
    steps:
      - name: Check out the exact main commit and complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Locate the merged internal pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls"
          --header 'Accept: application/vnd.github+json'
          > "$RUNNER_TEMP/associated-prs.json"
      - name: Verify release intent and version transition
        id: contract
        run: >-
          python3 scripts/release_contract.py authorize-main
          --before '${{ github.event.before }}'
          --head "$GITHUB_SHA"
          --prs-json "$RUNNER_TEMP/associated-prs.json"
      - name: Require exact-commit continuous integration
        if: steps.contract.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=""
          for _ in $(seq 1 60); do
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
              --event push --commit "$GITHUB_SHA" --limit 10 \
              --json databaseId,headSha \
              --jq '.[0].databaseId // empty')
            [ -n "$run_id" ] && break
            sleep 10
          done
          [ -n "$run_id" ] || { echo "Exact-commit CI run was not found." >&2; exit 1; }
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 15

  create-tag:
    name: create-immutable-release-tag
    needs: [authorize]
    if: needs.authorize.outputs.should-release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
    steps:
      - name: Check out the authorized main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Create the annotated tag once
        env:
          RELEASE_TAG: ${{ needs.authorize.outputs.tag }}
        run: |
          set -euo pipefail
          existing=$(git ls-remote origin "refs/tags/$RELEASE_TAG" | awk '{print $1}')
          if [ -n "$existing" ]; then
            git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA" || {
              echo "$RELEASE_TAG already identifies different immutable content." >&2
              exit 1
            }
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git tag --annotate "$RELEASE_TAG" --message "Ravenroot ${RELEASE_TAG#v}"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
      - name: Dispatch publication on the immutable tag ref
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.authorize.outputs.tag }}
        run: >-
          gh api --method POST
          "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/dispatches"
          -f "ref=$RELEASE_TAG" -f "inputs[tag]=$RELEASE_TAG"
