name: Fast feedback

# Ultralight feedback to whoever is working on a branch. This is advice, not a gate: the review
# candidate gets one dispatched full run before its pull request is opened, and the merge group
# verifies the integration commit in full again. This workflow now also carries the cheap checks the
# retired `admission` tier used to run on a pull request into `dev` — the review and CI contract
# suites, the UI unit tests, and a backend compile — so a branch author still gets that signal, on
# every push rather than only once a full run is dispatched.
#
# This workflow must never publish a check context named `ci-required`, as a success or as a skipped
# job. Check runs belong to the commit, and GitHub counts a skipped job as passed for a required
# check, so a fast run publishing that name would let a pull request into `dev` with this head merge
# without the full tier ever running on it. Its aggregator is `ci-fast` instead, and
# scripts/ci_required.py refuses any workflow other than ci.yml that defines `ci-required`.

on:
  push:
    branches: ['feature/**']

permissions:
  contents: read

# A burst of pushes collapses to one run for the latest commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Work-branch feedback intentionally checks only cheap invariants, plus the CI classifier's own
  # contract suites and the UI unit suite carried over from the retired `admission` tier: cheap enough
  # to repeat on every push. The expensive regression suites still belong to the review candidate's
  # dispatched full run and to the merge group, so those are not paid for at every push.
  fast-policy:
    name: fast-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history is needed only by the attribution check.
          fetch-depth: 0
      - name: Validate source bytes and Maven argLine composition
        run: |
          python3 scripts/check_no_raw_control_bytes.py
          python3 scripts/check_argline.py
      - name: Validate the Compose definition
        run: docker compose --file compose.yaml config --quiet
      - name: Verify the sandbox supervisor wiring
        run: ./dev.sh verify-supervisor
      - name: Check whitespace
        run: git diff --check HEAD^
      # AGENTS.md, Commit identity: no assistant attribution in the commits this change introduces.
      # The defence that does not depend on any tool's settings, read from the commits themselves.
      - name: Refuse assistant attribution in the new commits
        run: python3 scripts/check_commit_attribution.py
      # Carried over from the retired `admission-policy` job: the CI classifier and its gate are
      # exactly the code this push is most likely to have touched when it is CI-related, so their own
      # contract suites belong to the fastest feedback available, not only to a dispatched full run.
      - name: Verify the CI classification and gate contracts
        run: |
          python3 -m unittest scripts.tests.test_classify_main_change
          python3 -m unittest scripts.tests.test_ci_required
          python3 -m unittest scripts.tests.test_ci_topology

  fast-ui:
    name: fast-ui
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ravenroot/ravenroot-ui/package-lock.json
      - name: Install UI dependencies
        working-directory: ravenroot/ravenroot-ui
        run: npm ci
      - name: Build the UI
        working-directory: ravenroot/ravenroot-ui
        run: npm run build
      # Carried over from the retired `admission-ui` job.
      - name: Run the UI unit suite
        working-directory: ravenroot/ravenroot-ui
        run: npm test

  fast-backend:
    name: fast-backend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            ravenroot/pom.xml
            ravenroot/**/pom.xml
      # Carried over from the retired `admission-backend` job: a compile catches what a plain
      # `validate` cannot, without paying for the test suites the full tier already owns.
      - name: Compile backend production sources without testing them
        working-directory: ravenroot
        run: mvn -B --no-transfer-progress -DskipTests compile

  ci-fast:
    name: ci-fast
    if: always()
    needs:
      - fast-policy
      - fast-ui
      - fast-backend
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require every fast job, and that none of them can stand in for ci-required
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci_required.py --fast
