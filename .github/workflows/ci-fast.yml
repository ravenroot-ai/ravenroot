name: Fast feedback

# Ultralight feedback to whoever is working on a branch. This is advice, not a gate: the PR runs a
# small admission suite and the merge group verifies the integration commit in full.
#
# This workflow must never publish a check context named `ci-required`, as a success or as a skipped
# job. Check runs belong to the commit, and GitHub counts a skipped job as passed for a required
# check, so a fast run publishing that name would let a pull request into `dev` with this head merge
# without the full tier ever running on it. Its aggregator is `ci-fast` instead, and
# scripts/ci_required.py refuses any workflow other than ci.yml that defines `ci-required`.

on:
  push:
    branches: ['feature/**']

permissions:
  contents: read

# A burst of pushes collapses to one run for the latest commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Work-branch feedback intentionally checks only cheap invariants. Contract suites belong to the
  # review candidate and regression suites to the merge group, so the same test is not paid for at
  # every push.
  fast-policy:
    name: fast-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history is needed only by the attribution check.
          fetch-depth: 0
      - name: Validate source bytes and Maven argLine composition
        run: |
          python3 scripts/check_no_raw_control_bytes.py
          python3 scripts/check_argline.py
      - name: Validate the Compose definition
        run: docker compose --file compose.yaml config --quiet
      - name: Verify the sandbox supervisor wiring
        run: ./dev.sh verify-supervisor
      - name: Check whitespace
        run: git diff --check HEAD^
      # AGENTS.md, Commit identity: no assistant attribution in the commits this change introduces.
      # The defence that does not depend on any tool's settings, read from the commits themselves.
      - name: Refuse assistant attribution in the new commits
        run: python3 scripts/check_commit_attribution.py

  fast-ui:
    name: fast-ui
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ravenroot/ravenroot-ui/package-lock.json
      - name: Install UI dependencies
        working-directory: ravenroot/ravenroot-ui
        run: npm ci
      - name: Build the UI
        working-directory: ravenroot/ravenroot-ui
        run: npm run build

  fast-backend:
    name: fast-backend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            ravenroot/pom.xml
            ravenroot/**/pom.xml
      - name: Validate the backend reactor without compiling or testing it
        working-directory: ravenroot
        run: mvn -B --no-transfer-progress validate

  ci-fast:
    name: ci-fast
    if: always()
    needs:
      - fast-policy
      - fast-ui
      - fast-backend
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require every fast job, and that none of them can stand in for ci-required
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci_required.py --fast
