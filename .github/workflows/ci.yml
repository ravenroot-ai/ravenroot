name: Continuous integration

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  product-build:
    name: product-build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ravenroot/ravenroot-ui/package-lock.json

      - name: Build and verify the product
        run: ./ravenroot/scripts/build-release.sh

  support-build:
    name: support-build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Prepare support modules
        run: ./dev.sh setup --skip-ui

      - name: Verify external model adapters
        run: |
          for adapter in ravenroot-adapter-anthropic ravenroot-adapter-openai-compatible; do
            mvn -B --no-transfer-progress -f "$adapter/pom.xml" verify
          done

      - name: Verify the optional Akka runtime
        run: >-
          mvn -B --no-transfer-progress -f ravenroot/pom.xml
          -Pakka -pl ravenroot-akka verify

      - name: Verify the sample project
        run: mvn -B --no-transfer-progress -f ravenroot-sample/pom.xml verify

  tooling-contracts:
    name: tooling-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify Python tooling contracts
        run: |
          python3 -m unittest scripts.tests.test_check_argline
          python3 -m unittest scripts.tests.test_check_no_raw_control_bytes
          python3 -m unittest scripts.tests.test_verify_api_docs

      - name: Verify shell tooling contracts
        run: |
          ./scripts/tests/test_dev.sh
          ./scripts/tests/test_plugin.sh
          ./scripts/tests/test_service.sh
          ./scripts/tests/test_execution_store_platform.sh
          ./scripts/tests/test_execution_store_platform_regression.sh

      - name: Validate the Compose definition
        run: docker compose --file compose.yaml config --quiet

      - name: Check whitespace
        run: git diff --check HEAD^

  ci-required:
    name: ci-required
    if: always()
    needs:
      - product-build
      - support-build
      - tooling-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PRODUCT_BUILD_RESULT: ${{ needs.product-build.result }}
      SUPPORT_BUILD_RESULT: ${{ needs.support-build.result }}
      TOOLING_CONTRACTS_RESULT: ${{ needs.tooling-contracts.result }}
    steps:
      - name: Require every CI job to pass
        run: |
          test "$PRODUCT_BUILD_RESULT" = success
          test "$SUPPORT_BUILD_RESULT" = success
          test "$TOOLING_CONTRACTS_RESULT" = success
