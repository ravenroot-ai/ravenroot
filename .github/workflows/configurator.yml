name: Configurator

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ravenroot-configurator/**
      - ravenroot/ravenroot-server/src/main/java/ai/ravenroot/server/PublicationPolicyConfiguration.java
      - ravenroot/ravenroot-server/src/main/java/ai/ravenroot/server/audit/AuditTrailPublicationSink.java
      - ravenroot/ravenroot-server/src/main/java/ai/ravenroot/server/RavenrootServerMain.java
      - ravenroot/ravenroot-server/src/test/java/ai/ravenroot/server/PublicationPolicyConfigurationTest.java
      - .github/workflows/configurator.yml

permissions:
  contents: read

jobs:
  configurator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ravenroot-configurator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Enable the package-manager version declared by the project
        run: corepack enable && pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level moderate
      - run: pnpm build
      - run: pnpm test
      - run: pnpm example:amqp
      - name: Verify packaged-server publication policy carrier
        working-directory: .
        run: mvn -f ravenroot/pom.xml -pl ravenroot-server -am -Dtest=PublicationPolicyConfigurationTest -Dsurefire.failIfNoSpecifiedTests=false test
