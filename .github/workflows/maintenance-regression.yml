name: Schedule complete 0.8 regression
on:
  schedule:
    - cron: '47 3 * * 0'
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  dispatch-maintenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch complete verification on the maintained branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --method POST
          "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/dispatches"
          -f ref=release/0.8 -f 'inputs[tier]=full'
          -f 'inputs[integration_ref]=release/0.8' -f 'inputs[force_complete]=true'
