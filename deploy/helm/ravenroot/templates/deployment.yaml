apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ravenroot.fullname" . }}
  labels:
    {{- include "ravenroot.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "ravenroot.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ravenroot.selectorLabels" . | nindent 8 }}
    spec:
      # terminationGracePeriodSeconds is deliberately NOT set here (Kubernetes default: 30s), for the
      # same reason as the raw Kubernetes manifest (deploy/kubernetes/ravenroot.yaml): that default is
      # NOT safe once any long-lived deployments run on this pod, because
      # DefaultRavenrootApplication.close() stops them one at a time, not concurrently, so the pod's
      # worst-case graceful-shutdown time grows with RAVENROOT_MAX_ACTIVE_DEPLOYMENTS (M). See
      # ai.ravenroot.server.deployment.DeploymentCapConfiguration's Javadoc for the cited formula --
      # podShutdownSeconds(M) = 46 + 30*M seconds, 286s at the default cap of 8 -- and
      # ai.ravenroot.server.GracefulShutdown's Javadoc for what it deliberately does not cover
      # (in-flight executions at shutdown). This chart does not pick a number for you; set one
      # explicitly via an overlay before running any long-lived deployments.
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: ravenroot
          image: {{ include "ravenroot.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: RAVENROOT_PORT
              value: "8080"
            # Managed ingress is process-local and validates this actual workload setting before bind.
            - name: RAVENROOT_REPLICAS
              value: {{ .Values.replicaCount | quote }}
            - name: RAVENROOT_BIND_ADDRESS
              value: "0.0.0.0"
            - name: RAVENROOT_ENGINE
              value: {{ .Values.engine | quote }}
            # Blank runtime values select Java's typed defaults; explicit integers only tighten them.
            - name: RAVENROOT_ENGINE_MAX_STASHED_COMMANDS_PER_NODE
              value: {{ include "ravenroot.graphLimitValue" .Values.executionRuntime.maxStashedCommandsPerNode }}
            - name: RAVENROOT_ENGINE_LIFECYCLE_STEP_SECONDS
              value: {{ include "ravenroot.graphLimitValue" .Values.executionRuntime.lifecycleStepSeconds }}
            - name: RAVENROOT_ENGINE_TERMINAL_HISTORY_CAPACITY
              value: {{ include "ravenroot.graphLimitValue" .Values.executionRuntime.terminalHistoryCapacity }}
            - name: RAVENROOT_GRAPH_RUNNER_SHUTDOWN_STEP_SECONDS
              value: {{ include "ravenroot.graphLimitValue" .Values.executionRuntime.runnerShutdownStepSeconds }}
            # Empty graph-limit values select the Java typed defaults at startup. Explicit Helm
            # integers are rendered as quoted environment strings after schema validation.
            - name: RAVENROOT_GRAPHML_MAX_BYTES
              value: {{ include "ravenroot.graphLimitValue" .Values.graph.graphMl.maxBytes }}
            - name: RAVENROOT_GRAPH_MAX_NODES
              value: {{ include "ravenroot.graphLimitValue" .Values.graph.graphMl.maxNodes }}
            - name: RAVENROOT_GRAPH_MAX_EDGES
              value: {{ include "ravenroot.graphLimitValue" .Values.graph.graphMl.maxEdges }}
            - name: RAVENROOT_GRAPH_MAX_PROPERTIES
              value: {{ include "ravenroot.graphLimitValue" .Values.graph.graphMl.maxProperties }}
            - name: RAVENROOT_GRAPHML_MAX_DEPTH
              value: {{ include "ravenroot.graphLimitValue" .Values.graph.graphMl.maxDepth }}
            - name: RAVENROOT_GRAPHML_MAX_STRING_LENGTH
              value: {{ include "ravenroot.graphLimitValue" .Values.graph.graphMl.maxStringLength }}
            - name: RAVENROOT_GRAPHML_MAX_KEYS
              value: {{ include "ravenroot.graphLimitValue" .Values.graph.graphMl.maxKeys }}
            - name: RAVENROOT_GRAPHML_MAX_ELEMENTS
              value: {{ include "ravenroot.graphLimitValue" .Values.graph.graphMl.maxElements }}
            - name: RAVENROOT_GRAPHML_MAX_ATTRIBUTES
              value: {{ include "ravenroot.graphLimitValue" .Values.graph.graphMl.maxAttributes }}
            - name: RAVENROOT_GRAPHML_MAX_NAMESPACE_DECLARATIONS
              value: {{ include "ravenroot.graphLimitValue" .Values.graph.graphMl.maxNamespaceDeclarations }}
            - name: RAVENROOT_GRAPH_MAX_PAYLOAD_BYTES
              value: {{ include "ravenroot.graphLimitValue" .Values.graph.payload.maxEncodedBytes }}
            - name: RAVENROOT_GRAPH_MAX_PAYLOAD_DEPTH
              value: {{ include "ravenroot.graphLimitValue" .Values.graph.payload.maxDepth }}
            - name: RAVENROOT_GRAPH_MAX_PAYLOAD_COLLECTION_SIZE
              value: {{ include "ravenroot.graphLimitValue" .Values.graph.payload.maxCollectionSize }}
            - name: RAVENROOT_GRAPH_MAX_PAYLOAD_VALUE_COUNT
              value: {{ include "ravenroot.graphLimitValue" .Values.graph.payload.maxValueCount }}
            - name: RAVENROOT_GRAPH_MAX_PAYLOAD_TEXT_LENGTH
              value: {{ include "ravenroot.graphLimitValue" .Values.graph.payload.maxTextLength }}
            - name: RAVENROOT_GRAPH_MAX_PAYLOAD_KEY_LENGTH
              value: {{ include "ravenroot.graphLimitValue" .Values.graph.payload.maxKeyLength }}
            - name: RAVENROOT_GRAPH_MAX_FAN_OUT
              value: {{ include "ravenroot.graphLimitValue" .Values.graph.execution.maxFanOut }}
            - name: RAVENROOT_GRAPH_MAX_RESIDENT_ACTORS
              value: {{ include "ravenroot.graphLimitValue" .Values.graph.execution.maxResidentActors }}
            - name: RAVENROOT_GRAPH_MAX_LIVE_ACTORS_PER_TRAVERSAL
              value: {{ include "ravenroot.graphLimitValue" .Values.graph.execution.maxLiveActorsPerTraversal }}
            - name: RAVENROOT_GRAPH_MAX_IN_FLIGHT_HOPS
              value: {{ include "ravenroot.graphLimitValue" .Values.graph.execution.maxInFlightHopsPerTraversal }}
            - name: RAVENROOT_GRAPH_MAX_QUEUED_ADMISSIONS_PER_NODE
              value: {{ include "ravenroot.graphLimitValue" .Values.graph.execution.maxQueuedAdmissionsPerNode }}
            - name: RAVENROOT_GRAPH_MAX_TRAVERSAL_STEPS
              value: {{ include "ravenroot.graphLimitValue" .Values.graph.execution.maxTraversalSteps }}
            - name: RAVENROOT_GRAPH_MAX_AMPLIFIED_DELIVERIES
              value: {{ include "ravenroot.graphLimitValue" .Values.graph.execution.maxAmplifiedDeliveries }}
            - name: RAVENROOT_GRAPH_MAX_CUMULATIVE_PAYLOAD_BYTES
              value: {{ include "ravenroot.graphLimitValue" .Values.graph.execution.maxCumulativePayloadBytes }}
            - name: RAVENROOT_GRAPH_MAX_RECOVERY_DELIVERIES_PER_ATTEMPT
              value: {{ include "ravenroot.graphLimitValue" .Values.graph.execution.maxRecoveryDeliveriesPerAttempt }}
            - name: RAVENROOT_HUMAN_TASK_DEFAULT_RESPONSE_BYTES
              value: {{ include "ravenroot.humanTaskValue" .Values.humanTask.defaultResponseBytes }}
            - name: RAVENROOT_HUMAN_TASK_MAX_RESPONSE_BYTES
              value: {{ include "ravenroot.humanTaskValue" .Values.humanTask.maxResponseBytes }}
            - name: RAVENROOT_HUMAN_TASK_DEFAULT_ESCALATION_SECONDS
              value: {{ include "ravenroot.humanTaskValue" .Values.humanTask.defaultEscalationSeconds }}
            - name: RAVENROOT_HUMAN_TASK_MAX_ESCALATION_SECONDS
              value: {{ include "ravenroot.humanTaskValue" .Values.humanTask.maxEscalationSeconds }}
            - name: RAVENROOT_HUMAN_TASK_DEFAULT_EXPIRY_SECONDS
              value: {{ include "ravenroot.humanTaskValue" .Values.humanTask.defaultExpirySeconds }}
            - name: RAVENROOT_HUMAN_TASK_MAX_EXPIRY_SECONDS
              value: {{ include "ravenroot.humanTaskValue" .Values.humanTask.maxExpirySeconds }}
            - name: RAVENROOT_HUMAN_TASK_MAX_TITLE_BYTES
              value: {{ include "ravenroot.humanTaskValue" .Values.humanTask.maxTitleBytes }}
            - name: RAVENROOT_HUMAN_TASK_MAX_DESCRIPTION_BYTES
              value: {{ include "ravenroot.humanTaskValue" .Values.humanTask.maxDescriptionBytes }}
            - name: RAVENROOT_HUMAN_TASK_MAX_RESPONSE_SCHEMA_BYTES
              value: {{ include "ravenroot.humanTaskValue" .Values.humanTask.maxResponseSchemaBytes }}
            - name: RAVENROOT_HUMAN_TASK_MAX_AUTHORIZATION_TOKENS
              value: {{ include "ravenroot.humanTaskValue" .Values.humanTask.maxAuthorizationTokens }}
            - name: RAVENROOT_HUMAN_TASK_MAX_AUTHORIZATION_TOKEN_BYTES
              value: {{ include "ravenroot.humanTaskValue" .Values.humanTask.maxAuthorizationTokenBytes }}
            - name: RAVENROOT_HUMAN_TASK_MAX_DECISION_BODY_BYTES
              value: {{ include "ravenroot.humanTaskValue" .Values.humanTask.maxDecisionBodyBytes }}
            - name: RAVENROOT_HUMAN_TASK_DEFAULT_PAGE_SIZE
              value: {{ include "ravenroot.humanTaskValue" .Values.humanTask.defaultPageSize }}
            - name: RAVENROOT_HUMAN_TASK_MAX_PAGE_SIZE
              value: {{ include "ravenroot.humanTaskValue" .Values.humanTask.maxPageSize }}
            - name: RAVENROOT_HUMAN_TASK_RESPONSE_MAX_DEPTH
              value: {{ include "ravenroot.humanTaskValue" .Values.humanTask.responseMaxDepth }}
            - name: RAVENROOT_HUMAN_TASK_RESPONSE_MAX_COLLECTION_SIZE
              value: {{ include "ravenroot.humanTaskValue" .Values.humanTask.responseMaxCollectionSize }}
            - name: RAVENROOT_HUMAN_TASK_RESPONSE_MAX_VALUE_COUNT
              value: {{ include "ravenroot.humanTaskValue" .Values.humanTask.responseMaxValueCount }}
            - name: RAVENROOT_HUMAN_TASK_RESPONSE_MAX_TEXT_LENGTH
              value: {{ include "ravenroot.humanTaskValue" .Values.humanTask.responseMaxTextLength }}
            - name: RAVENROOT_HUMAN_TASK_RESPONSE_MAX_KEY_LENGTH
              value: {{ include "ravenroot.humanTaskValue" .Values.humanTask.responseMaxKeyLength }}
            - name: RAVENROOT_HUMAN_TASK_WRITE_ATTEMPTS
              value: {{ include "ravenroot.humanTaskValue" .Values.humanTask.writeAttempts }}
            - name: RAVENROOT_HUMAN_TASK_MAX_CONFIRMATION_PROMPT_BYTES
              value: {{ include "ravenroot.humanTaskValue" .Values.humanTask.maxConfirmationPromptBytes }}
            - name: RAVENROOT_HUMAN_TASK_MAX_CONFIRMATION_ACTION_LABEL_BYTES
              value: {{ include "ravenroot.humanTaskValue" .Values.humanTask.maxConfirmationActionLabelBytes }}
            - name: RAVENROOT_HUMAN_TASK_MAX_DECISION_COMMENT_BYTES
              value: {{ include "ravenroot.humanTaskValue" .Values.humanTask.maxDecisionCommentBytes }}
            - name: RAVENROOT_HUMAN_TASK_ATTENTION_POLL_MILLIS
              value: {{ include "ravenroot.humanTaskValue" .Values.humanTask.attentionPollMillis }}
            - name: RAVENROOT_HUMAN_TASK_ATTENTION_POLL_BACKOFF_MAX_MILLIS
              value: {{ include "ravenroot.humanTaskValue" .Values.humanTask.attentionPollBackoffMaxMillis }}
            - name: RAVENROOT_HUMAN_TASK_DEFAULT_ATTENTION_PAGE_SIZE
              value: {{ include "ravenroot.humanTaskValue" .Values.humanTask.defaultAttentionPageSize }}
            - name: RAVENROOT_HUMAN_TASK_MAX_ATTENTION_PAGE_SIZE
              value: {{ include "ravenroot.humanTaskValue" .Values.humanTask.maxAttentionPageSize }}
            # Blank assistant limits preserve the Java defaults. Explicit values may only tighten
            # the existing deployed output and provider-turn maxima.
            - name: RAVENROOT_ASSISTANT_MAX_OUTPUT_TOKENS
              value: {{ include "ravenroot.graphLimitValue" .Values.assistant.maxOutputTokens }}
            - name: RAVENROOT_ASSISTANT_MAX_TOOL_ITERATIONS
              value: {{ include "ravenroot.graphLimitValue" .Values.assistant.maxToolIterations }}
            # Blank authoring limits preserve the typed Java defaults. Explicit chart values are
            # validated as positive integers bounded by the public artifact/build contracts.
            - name: RAVENROOT_PROGRAM_AUTHORING_MAX_SOURCE_BYTES
              value: {{ include "ravenroot.graphLimitValue" .Values.programAuthoring.maxSourceBytes }}
            - name: RAVENROOT_PROGRAM_AUTHORING_MAX_BUILD_REQUEST_BYTES
              value: {{ include "ravenroot.graphLimitValue" .Values.programAuthoring.maxBuildRequestBytes }}
            - name: RAVENROOT_PROGRAM_AUTHORING_MAX_PROGRAMS_PER_BUILD
              value: {{ include "ravenroot.graphLimitValue" .Values.programAuthoring.maxProgramsPerBuild }}
            # Empty rate-limit values select RateLimitConfiguration.DEFAULTS at startup.
            - name: RAVENROOT_RATELIMIT_ADDRESS_RPS
              value: {{ include "ravenroot.graphLimitValue" .Values.rateLimit.addressRequestsPerSecond }}
            - name: RAVENROOT_RATELIMIT_ADDRESS_BURST
              value: {{ include "ravenroot.graphLimitValue" .Values.rateLimit.addressBurst }}
            - name: RAVENROOT_RATELIMIT_TENANT_RPS
              value: {{ include "ravenroot.graphLimitValue" .Values.rateLimit.tenantRequestsPerSecond }}
            - name: RAVENROOT_RATELIMIT_TENANT_BURST
              value: {{ include "ravenroot.graphLimitValue" .Values.rateLimit.tenantBurst }}
            - name: RAVENROOT_RATELIMIT_PRINCIPAL_RPS
              value: {{ include "ravenroot.graphLimitValue" .Values.rateLimit.principalRequestsPerSecond }}
            - name: RAVENROOT_RATELIMIT_PRINCIPAL_BURST
              value: {{ include "ravenroot.graphLimitValue" .Values.rateLimit.principalBurst }}
            - name: RAVENROOT_RATELIMIT_SUBMISSION_RPS
              value: {{ include "ravenroot.graphLimitValue" .Values.rateLimit.submissionsPerSecond }}
            - name: RAVENROOT_RATELIMIT_SUBMISSION_BURST
              value: {{ include "ravenroot.graphLimitValue" .Values.rateLimit.submissionBurst }}
            - name: RAVENROOT_RATELIMIT_TENANT_CONCURRENT_SUBMISSIONS
              value: {{ include "ravenroot.graphLimitValue" .Values.rateLimit.tenantConcurrentSubmissions }}
            - name: RAVENROOT_RATELIMIT_GLOBAL_ACTIVE_EXECUTIONS
              value: {{ include "ravenroot.graphLimitValue" .Values.rateLimit.globalActiveExecutions }}
            - name: RAVENROOT_RATELIMIT_TENANT_STREAMS
              value: {{ include "ravenroot.graphLimitValue" .Values.rateLimit.tenantConcurrentStreams }}
            - name: RAVENROOT_RATELIMIT_PRINCIPAL_STREAMS
              value: {{ include "ravenroot.graphLimitValue" .Values.rateLimit.principalConcurrentStreams }}
            - name: RAVENROOT_SSE_QUEUE_CAPACITY
              value: {{ include "ravenroot.graphLimitValue" .Values.rateLimit.streamQueueCapacity }}
            - name: RAVENROOT_RATELIMIT_MAX_QUERY_BYTES
              value: {{ include "ravenroot.graphLimitValue" .Values.rateLimit.maxQueryBytes }}
            - name: RAVENROOT_RATELIMIT_MAX_QUERY_PARAMETERS
              value: {{ include "ravenroot.graphLimitValue" .Values.rateLimit.maxQueryParameters }}
            - name: RAVENROOT_RATELIMIT_MAX_HEADER_COUNT
              value: {{ include "ravenroot.graphLimitValue" .Values.rateLimit.maxHeaderCount }}
            - name: RAVENROOT_RATELIMIT_MAX_HEADER_BYTES
              value: {{ include "ravenroot.graphLimitValue" .Values.rateLimit.maxHeaderBytes }}
            - name: RAVENROOT_RATELIMIT_MAX_HEADER_VALUE_BYTES
              value: {{ include "ravenroot.graphLimitValue" .Values.rateLimit.maxHeaderValueBytes }}
            - name: RAVENROOT_RATELIMIT_MAX_TRACKED_CLIENTS
              value: {{ include "ravenroot.graphLimitValue" .Values.rateLimit.maxTrackedClients }}
            - name: RAVENROOT_RATELIMIT_MAX_TRACKED_TENANTS
              value: {{ include "ravenroot.graphLimitValue" .Values.rateLimit.maxTrackedTenants }}
            - name: RAVENROOT_RATELIMIT_MAX_TRACKED_PRINCIPALS
              value: {{ include "ravenroot.graphLimitValue" .Values.rateLimit.maxTrackedPrincipals }}
            - name: RAVENROOT_RATELIMIT_IDLE_TTL_SECONDS
              value: {{ include "ravenroot.graphLimitValue" .Values.rateLimit.idleEntryTtlSeconds }}
            - name: RAVENROOT_RATELIMIT_EXECUTION_MAX_AGE_SECONDS
              value: {{ include "ravenroot.graphLimitValue" .Values.rateLimit.executionMaxAgeSeconds }}
            # The default execution store is SQLite/WAL. It shares this one-pod RWO volume with the
            # durable audit trail and must never be placed on the read-only root filesystem or /tmp.
            - name: RAVENROOT_AUDIT_DIR
              value: /opt/ravenroot/data/audit
            - name: RAVENROOT_EXECUTION_STORE_DIR
              value: /opt/ravenroot/data/execution-store
            - name: RAVENROOT_ARTIFACT_STORE_DIR
              value: /opt/ravenroot/data/artifact-store
            - name: RAVENROOT_AUTH_ISSUER
              value: {{ required "auth.issuer is required" .Values.auth.issuer | quote }}
            - name: RAVENROOT_AUTH_AUDIENCE
              value: {{ required "auth.audience is required" .Values.auth.audience | quote }}
            - name: RAVENROOT_AUTH_JWKS_URI
              value: {{ required "auth.jwksUri is required" .Values.auth.jwksUri | quote }}
            # A blank overlay delegates to GraalVmProgramRuntime's typed default. A nonblank value
            # is checked by the chart schema before it reaches the process environment.
            - name: RAVENROOT_PROGRAM_TIMEOUT_MS
              value: {{ include "ravenroot.graphLimitValue" .Values.programTimeoutMs }}
          # ReadinessProbe is deliberately /ready, not /health: /ready
          # reports unready during draining and a degraded audit-trail check (ReadinessGate),
          # which is what should pull this pod out of rotation without restarting it. See
          # docs/runbooks/plat-02-readiness-drain-and-alerts.md for the grace-period
          # sizing this split now makes reachable in practice.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          # livenessProbe stays /health deliberately: pointing it at /ready would restart the pod
          # on drain instead of rotating it out of the load balancer, the outage this split exists
          # to prevent.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
            - name: ravenroot-data
              mountPath: /opt/ravenroot/data
      volumes:
        - name: temporary-files
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.tmpfs.sizeLimit | quote }}
        - name: ravenroot-data
          persistentVolumeClaim:
            claimName: {{ include "ravenroot.fullname" . }}-data
