{{- if .Values.runnerPlane.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ravenroot.fullname" . }}-runner-coordinator
spec:
  replicas: {{ .Values.runnerPlane.coordinatorReplicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ravenroot.fullname" . }}-runner-coordinator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ravenroot.fullname" . }}-runner-coordinator
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: {{ .Values.securityContext.runAsUser }}
        runAsGroup: {{ .Values.securityContext.runAsGroup }}
        fsGroup: {{ .Values.podSecurityContext.fsGroup }}
      containers:
        - name: coordinator
          image: {{ include "ravenroot.image" . | quote }}
          command: [java, -cp, /opt/ravenroot/ravenroot.jar, ai.ravenroot.server.RunnerCoordinatorMain]
          envFrom:
            - secretRef:
                name: {{ .Values.runnerPlane.sharedEnvironmentSecret }}
          env:
            - { name: RAVENROOT_AUTH_MODE, value: oidc }
            - { name: RAVENROOT_BIND_ADDRESS, value: "0.0.0.0" }
            - { name: RAVENROOT_PORT, value: {{ .Values.runnerPlane.coordinatorPort | quote }} }
            - { name: RAVENROOT_RUNNER_SHARED_ARTIFACTS, value: "true" }
            - { name: RAVENROOT_RUNNER_CONFIG, value: /etc/ravenroot/runner-plane/control-plane.json }
            - name: RAVENROOT_RUNNER_COORDINATOR_HTTP_THREADS
              value: {{ .Values.runnerPlane.coordinatorHttpThreads | quote }}
            - name: RAVENROOT_RUNNER_COORDINATOR_HTTP_QUEUE
              value: {{ .Values.runnerPlane.coordinatorHttpQueue | quote }}
          ports: [{ name: http, containerPort: {{ .Values.runnerPlane.coordinatorPort }} }]
          readinessProbe:
            tcpSocket: { port: http }
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          resources:
            {{- toYaml .Values.runnerPlane.coordinatorResources | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/ravenroot/runner-plane, readOnly: true }
            - { name: artifacts, mountPath: /var/lib/ravenroot/runner-artifacts }
            - { name: temporary, mountPath: /tmp }
      volumes:
        - name: config
          configMap: { name: {{ .Values.runnerPlane.configMap }} }
        - name: artifacts
          persistentVolumeClaim: { claimName: {{ .Values.runnerPlane.artifactClaim }} }
        - name: temporary
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ravenroot.fullname" . }}-runner-coordinator
spec:
  selector:
    app.kubernetes.io/name: {{ include "ravenroot.fullname" . }}-runner-coordinator
  ports: [{ name: http, port: {{ .Values.runnerPlane.coordinatorPort }}, targetPort: http }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "ravenroot.fullname" . }}-runner-coordinator
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ravenroot.fullname" . }}-runner-coordinator
{{- $root := . }}
{{- $names := dict }}
{{- range .Values.runnerPlane.workerPools }}
{{- if hasKey $names .name }}{{ fail "runner pool names must be unique" }}{{ end }}
{{- $_ := set $names .name true }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "ravenroot.fullname" $root }}-worker-{{ .name }}
spec:
  serviceName: {{ include "ravenroot.fullname" $root }}-worker-{{ .name }}
  replicas: {{ .replicas }}
  selector:
    matchLabels:
      ravenroot.ai/worker-pool: {{ .name }}
      app.kubernetes.io/instance: {{ $root.Release.Name }}
  template:
    metadata:
      labels:
        ravenroot.ai/worker-pool: {{ .name }}
        app.kubernetes.io/instance: {{ $root.Release.Name }}
    spec:
      automountServiceAccountToken: false
      {{- if eq .driver "kubernetes" }}
      serviceAccountName: {{ include "ravenroot.fullname" $root }}-manager-{{ .name }}
      {{- end }}
      nodeSelector:
        {{- toYaml .nodeSelector | nindent 8 }}
      containers:
        - name: {{ if eq .driver "kubernetes" }}manager{{ else }}supervisor{{ end }}
          image: {{ .image | quote }}
          args: [/etc/ravenroot/worker/worker.json]
          {{- if eq .driver "kubernetes" }}
          readinessProbe:
            exec:
              command: [java, -cp, /opt/ravenroot/ravenroot.jar, ai.ravenroot.server.RunnerReadinessMain, /tmp/ravenroot-runner-ready]
            periodSeconds: 5
          {{- end }}
          env:
            - name: RAVENROOT_RUNNER_INSTANCE
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
            {{- if eq .driver "kubernetes" }}
            - { name: RAVENROOT_RUNNER_READINESS_FILE, value: /tmp/ravenroot-runner-ready }
            {{- end }}
          envFrom:
            - secretRef: { name: {{ .modelSecret }} }
          # The supervisor is deliberately authority-bearing on dedicated Docker hosts.
          # Root owns the projected 0400 workload token. Agent runtimes are separately non-root,
          # no-network, no-mount containers, and never receive this socket, config or credential.
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            {{- toYaml .resources | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/ravenroot/worker, readOnly: true }
            - { name: identities, mountPath: /run/identities, readOnly: true }
            - { name: state, mountPath: /var/lib/ravenroot-runner }
            {{- if eq .driver "docker" }}
            - { name: docker, mountPath: /var/run/docker.sock }
            {{- else }}
            - { name: kubernetes-identity, mountPath: /var/run/ravenroot-kubernetes, readOnly: true }
            - { name: kubernetes-config, mountPath: /etc/ravenroot/kubernetes, readOnly: true }
            {{- end }}
            - { name: temporary, mountPath: /tmp }
      volumes:
        - name: config
          configMap: { name: {{ .configMap }} }
        - name: identities
          secret: { secretName: {{ .identitySecret }}, defaultMode: 256 }
        {{- if eq .driver "docker" }}
        - name: docker
          hostPath: { path: {{ .socketHostPath | quote }}, type: Socket }
        {{- else }}
        - name: kubernetes-identity
          projected:
            defaultMode: 256
            sources:
              - serviceAccountToken: { path: token, expirationSeconds: 3600 }
              - configMap:
                  name: kube-root-ca.crt
                  items: [{ key: ca.crt, path: ca.crt }]
        - name: kubernetes-config
          configMap: { name: {{ include "ravenroot.fullname" $root }}-kubernetes-{{ .name }} }
        {{- end }}
        - name: temporary
          emptyDir: {}
  volumeClaimTemplates:
    - metadata: { name: state }
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .storageClass }}
        storageClassName: {{ .storageClass | quote }}
        {{- end }}
        resources:
          requests: { storage: {{ .stateSize | quote }} }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ravenroot.fullname" $root }}-worker-{{ .name }}
spec:
  clusterIP: None
  selector:
    ravenroot.ai/worker-pool: {{ .name }}
    app.kubernetes.io/instance: {{ $root.Release.Name }}
  ports: [{ name: identity, port: 65535, targetPort: 65535 }]
{{- end }}
{{- end }}
