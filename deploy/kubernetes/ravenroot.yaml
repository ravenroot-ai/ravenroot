apiVersion: apps/v1
kind: Deployment
metadata:
  name: ravenroot
  labels:
    app.kubernetes.io/name: ravenroot
spec:
  # Runtime events are currently local to one process. Do not scale horizontally
  # until execution ownership and the event stream have a distributed backend.
  replicas: 1
  # A replacement pod must not overlap the old pod on the local SQLite/WAL volume. The manifest's
  # ReadWriteOnce claim is a storage guard; Recreate is the workload-level guard against a rolling
  # update creating two writers during handover.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ravenroot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ravenroot
    spec:
      # terminationGracePeriodSeconds is deliberately NOT set here (Kubernetes default: 30s), and
      # sizing it is an operator decision -- but the Kubernetes default is NOT a safe choice once any
      # long-lived deployments run on this pod: DefaultRavenrootApplication.close() stops them one at
      # a time, not concurrently, so the pod's own worst-case graceful-shutdown time grows with
      # RAVENROOT_MAX_ACTIVE_DEPLOYMENTS (M) rather than staying fixed. See
      # ai.ravenroot.server.deployment.DeploymentCapConfiguration's Javadoc for the exact, cited
      # formula and its derivation (ravenroot-server/src/main/java/ai/ravenroot/server/deployment/
      # DeploymentCapConfiguration.java); as of that Javadoc, the worst case is
      # podShutdownSeconds(M) = 46 + 30*M seconds, which is 286s at this file's implied default cap
      # of 8 -- nearly ten times the unset Kubernetes default. Also account for peak concurrent
      # in-flight executions at shutdown, which that formula deliberately does not cover (see
      # ai.ravenroot.server.GracefulShutdown's own Javadoc). This file does not pick a number for
      # you; an operator running any long-lived deployments must set one explicitly.
      securityContext:
        runAsNonRoot: true
        # The PVC is mounted empty by Kubernetes (unlike Docker named-volume copy-up), so fsGroup
        # makes its root writable by the image's fixed non-root UID/GID without weakening the
        # container securityContext or adding a root init container.
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ravenroot
          image: ravenroot:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: RAVENROOT_PORT
              value: "8080"
            # Must match spec.replicas: managed route ownership is intentionally single-process.
            - name: RAVENROOT_REPLICAS
              value: "1"
            - name: RAVENROOT_BIND_ADDRESS
              value: "0.0.0.0"
            - name: RAVENROOT_ENGINE
              value: pekko
            # Blank execution-runtime carriers select the Java typed defaults.
            - name: RAVENROOT_ENGINE_MAX_STASHED_COMMANDS_PER_NODE
              value: ""
            - name: RAVENROOT_ENGINE_LIFECYCLE_STEP_SECONDS
              value: ""
            - name: RAVENROOT_ENGINE_TERMINAL_HISTORY_CAPACITY
              value: ""
            - name: RAVENROOT_GRAPH_RUNNER_SHUTDOWN_STEP_SECONDS
              value: ""
            # Empty graph-limit values select the Java typed defaults. Kustomize overlays may
            # replace individual values with quoted positive integers within the documented bounds.
            - name: RAVENROOT_GRAPHML_MAX_BYTES
              value: ""
            - name: RAVENROOT_GRAPH_MAX_NODES
              value: ""
            - name: RAVENROOT_GRAPH_MAX_EDGES
              value: ""
            - name: RAVENROOT_GRAPH_MAX_PROPERTIES
              value: ""
            - name: RAVENROOT_GRAPHML_MAX_DEPTH
              value: ""
            - name: RAVENROOT_GRAPHML_MAX_STRING_LENGTH
              value: ""
            - name: RAVENROOT_GRAPHML_MAX_KEYS
              value: ""
            - name: RAVENROOT_GRAPHML_MAX_ELEMENTS
              value: ""
            - name: RAVENROOT_GRAPHML_MAX_ATTRIBUTES
              value: ""
            - name: RAVENROOT_GRAPHML_MAX_NAMESPACE_DECLARATIONS
              value: ""
            - name: RAVENROOT_GRAPH_MAX_PAYLOAD_BYTES
              value: ""
            - name: RAVENROOT_GRAPH_MAX_PAYLOAD_DEPTH
              value: ""
            - name: RAVENROOT_GRAPH_MAX_PAYLOAD_COLLECTION_SIZE
              value: ""
            - name: RAVENROOT_GRAPH_MAX_PAYLOAD_VALUE_COUNT
              value: ""
            - name: RAVENROOT_GRAPH_MAX_PAYLOAD_TEXT_LENGTH
              value: ""
            - name: RAVENROOT_GRAPH_MAX_PAYLOAD_KEY_LENGTH
              value: ""
            - name: RAVENROOT_GRAPH_MAX_FAN_OUT
              value: ""
            - name: RAVENROOT_GRAPH_MAX_RESIDENT_ACTORS
              value: ""
            - name: RAVENROOT_GRAPH_MAX_LIVE_ACTORS_PER_TRAVERSAL
              value: ""
            - name: RAVENROOT_GRAPH_MAX_IN_FLIGHT_HOPS
              value: ""
            - name: RAVENROOT_GRAPH_MAX_QUEUED_ADMISSIONS_PER_NODE
              value: ""
            - name: RAVENROOT_GRAPH_MAX_TRAVERSAL_STEPS
              value: ""
            - name: RAVENROOT_GRAPH_MAX_AMPLIFIED_DELIVERIES
              value: ""
            - name: RAVENROOT_GRAPH_MAX_CUMULATIVE_PAYLOAD_BYTES
              value: ""
            - name: RAVENROOT_GRAPH_MAX_RECOVERY_DELIVERIES_PER_ATTEMPT
              value: ""
            # Empty Human Task policy values select the Java typed defaults. Kustomize overlays may
            # replace individual values with quoted integers within the documented bounds.
            - name: RAVENROOT_HUMAN_TASK_DEFAULT_RESPONSE_BYTES
              value: ""
            - name: RAVENROOT_HUMAN_TASK_MAX_RESPONSE_BYTES
              value: ""
            - name: RAVENROOT_HUMAN_TASK_DEFAULT_ESCALATION_SECONDS
              value: ""
            - name: RAVENROOT_HUMAN_TASK_MAX_ESCALATION_SECONDS
              value: ""
            - name: RAVENROOT_HUMAN_TASK_DEFAULT_EXPIRY_SECONDS
              value: ""
            - name: RAVENROOT_HUMAN_TASK_MAX_EXPIRY_SECONDS
              value: ""
            - name: RAVENROOT_HUMAN_TASK_MAX_TITLE_BYTES
              value: ""
            - name: RAVENROOT_HUMAN_TASK_MAX_DESCRIPTION_BYTES
              value: ""
            - name: RAVENROOT_HUMAN_TASK_MAX_RESPONSE_SCHEMA_BYTES
              value: ""
            - name: RAVENROOT_HUMAN_TASK_MAX_AUTHORIZATION_TOKENS
              value: ""
            - name: RAVENROOT_HUMAN_TASK_MAX_AUTHORIZATION_TOKEN_BYTES
              value: ""
            - name: RAVENROOT_HUMAN_TASK_MAX_DECISION_BODY_BYTES
              value: ""
            - name: RAVENROOT_HUMAN_TASK_DEFAULT_PAGE_SIZE
              value: ""
            - name: RAVENROOT_HUMAN_TASK_MAX_PAGE_SIZE
              value: ""
            - name: RAVENROOT_HUMAN_TASK_RESPONSE_MAX_DEPTH
              value: ""
            - name: RAVENROOT_HUMAN_TASK_RESPONSE_MAX_COLLECTION_SIZE
              value: ""
            - name: RAVENROOT_HUMAN_TASK_RESPONSE_MAX_VALUE_COUNT
              value: ""
            - name: RAVENROOT_HUMAN_TASK_RESPONSE_MAX_TEXT_LENGTH
              value: ""
            - name: RAVENROOT_HUMAN_TASK_RESPONSE_MAX_KEY_LENGTH
              value: ""
            - name: RAVENROOT_HUMAN_TASK_WRITE_ATTEMPTS
              value: ""
            - name: RAVENROOT_HUMAN_TASK_MAX_CONFIRMATION_PROMPT_BYTES
              value: ""
            - name: RAVENROOT_HUMAN_TASK_MAX_CONFIRMATION_ACTION_LABEL_BYTES
              value: ""
            - name: RAVENROOT_HUMAN_TASK_MAX_DECISION_COMMENT_BYTES
              value: ""
            - name: RAVENROOT_HUMAN_TASK_ATTENTION_POLL_MILLIS
              value: ""
            - name: RAVENROOT_HUMAN_TASK_ATTENTION_POLL_BACKOFF_MAX_MILLIS
              value: ""
            - name: RAVENROOT_HUMAN_TASK_DEFAULT_ATTENTION_PAGE_SIZE
              value: ""
            - name: RAVENROOT_HUMAN_TASK_MAX_ATTENTION_PAGE_SIZE
              value: ""
            # Blank assistant limits preserve the Java defaults. Overlays may provide quoted
            # positive integers that tighten the existing deployed maxima.
            - name: RAVENROOT_ASSISTANT_MAX_OUTPUT_TOKENS
              value: ""
            - name: RAVENROOT_ASSISTANT_MAX_TOOL_ITERATIONS
              value: ""
            # Empty rate-limit values select the Java-owned defaults. Overlays provide quoted
            # integers; sibling relationships are validated together at server startup.
            - name: RAVENROOT_RATELIMIT_ADDRESS_RPS
              value: ""
            - name: RAVENROOT_RATELIMIT_ADDRESS_BURST
              value: ""
            - name: RAVENROOT_RATELIMIT_TENANT_RPS
              value: ""
            - name: RAVENROOT_RATELIMIT_TENANT_BURST
              value: ""
            - name: RAVENROOT_RATELIMIT_PRINCIPAL_RPS
              value: ""
            - name: RAVENROOT_RATELIMIT_PRINCIPAL_BURST
              value: ""
            - name: RAVENROOT_RATELIMIT_SUBMISSION_RPS
              value: ""
            - name: RAVENROOT_RATELIMIT_SUBMISSION_BURST
              value: ""
            - name: RAVENROOT_RATELIMIT_TENANT_CONCURRENT_SUBMISSIONS
              value: ""
            - name: RAVENROOT_RATELIMIT_GLOBAL_ACTIVE_EXECUTIONS
              value: ""
            - name: RAVENROOT_RATELIMIT_TENANT_STREAMS
              value: ""
            - name: RAVENROOT_RATELIMIT_PRINCIPAL_STREAMS
              value: ""
            - name: RAVENROOT_SSE_QUEUE_CAPACITY
              value: ""
            - name: RAVENROOT_RATELIMIT_MAX_QUERY_BYTES
              value: ""
            - name: RAVENROOT_RATELIMIT_MAX_QUERY_PARAMETERS
              value: ""
            - name: RAVENROOT_RATELIMIT_MAX_HEADER_COUNT
              value: ""
            - name: RAVENROOT_RATELIMIT_MAX_HEADER_BYTES
              value: ""
            - name: RAVENROOT_RATELIMIT_MAX_HEADER_VALUE_BYTES
              value: ""
            - name: RAVENROOT_RATELIMIT_MAX_TRACKED_CLIENTS
              value: ""
            - name: RAVENROOT_RATELIMIT_MAX_TRACKED_TENANTS
              value: ""
            - name: RAVENROOT_RATELIMIT_MAX_TRACKED_PRINCIPALS
              value: ""
            - name: RAVENROOT_RATELIMIT_IDLE_TTL_SECONDS
              value: ""
            - name: RAVENROOT_RATELIMIT_EXECUTION_MAX_AGE_SECONDS
              value: ""
            # A local SQLite store is a single-pod durability mode. The main database and its WAL
            # sidecars share this RWO PVC with the audit trail; neither may fall back to read-only
            # image layers or the tmpfs below.
            - name: RAVENROOT_AUDIT_DIR
              value: /opt/ravenroot/data/audit
            - name: RAVENROOT_EXECUTION_STORE_DIR
              value: /opt/ravenroot/data/execution-store
            - name: RAVENROOT_ARTIFACT_STORE_DIR
              value: /opt/ravenroot/data/artifact-store
            # Fail-closed: RAVENROOT_AUTH_MODE defaults to oidc in the image, and startup requires
            # issuer/audience/JWKS. These three are public OIDC configuration (the provider already
            # publishes them at /.well-known/openid-configuration), not secrets, so they come from a
            # ConfigMap rather than a Secret. The ConfigMap is intentionally not part of this
            # kustomization: create it before `kubectl apply -k .`, see docs/deployment.md,
            # "Kubernetes/Kustomize". Missing it fails the Pod with CreateContainerConfigError
            # instead of a silently degraded, unauthenticated deployment.
            - name: RAVENROOT_AUTH_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: ravenroot-auth
                  key: issuer
            - name: RAVENROOT_AUTH_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: ravenroot-auth
                  key: audience
            - name: RAVENROOT_AUTH_JWKS_URI
              valueFrom:
                configMapKeyRef:
                  name: ravenroot-auth
                  key: jwksUri
            # This manifest
            # does not configure RAVENROOT_GRAAL_SANDBOX_SUPERVISOR (SEC-11 is integrator-provided by
            # design, see docs/deployment.md), so this value only matters once an operator adds one
            # via a kustomize patch -- but its own default must still not be the code's 5000ms, which
            # is unsafe against a measured Python cold start (~2.4-2.9s idle, measured through
            # deploy/dev/sandbox-supervisor.sh under a read-only root filesystem; F30 records a much
            # higher figure -- 8.1s -- under CI-typical load on an older component version). This is
            # F30's option (a), the bridge it names explicitly while the real fix (F30's option (c),
            # a pre-initialized native build) is undecided -- NOT a capacity number chosen for any
            # specific deployment. An operator sizing a real production timeout should read F30.
            - name: RAVENROOT_PROGRAM_TIMEOUT_MS
              value: "15000"
          # ReadinessProbe answers "should traffic come here" and is
          # deliberately /ready, not /health: /ready reports unready during draining and a
          # degraded audit-trail check (ReadinessGate), which is exactly what should pull this
          # pod out of rotation without restarting it. See
          # docs/runbooks/plat-02-readiness-drain-and-alerts.md for the grace-period
          # sizing this probe split now makes reachable in practice.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          # livenessProbe stays /health deliberately: "is the process alive, restart it if not"
          # is a different question from readiness, and pointing this at /ready would restart the
          # pod on drain instead of rotating it out of the load balancer -- the outage this split
          # exists to prevent, not cause.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            runAsUser: 10001
            runAsGroup: 10001
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
            - name: ravenroot-data
              mountPath: /opt/ravenroot/data
      volumes:
        - name: temporary-files
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        # ReadWriteOnce is intentional. SQLite/WAL is a single-host store, not a shared-PV or
        # multi-replica authority; keep replicas at 1 because distributed ownership is not provided.
        - name: ravenroot-data
          persistentVolumeClaim:
            claimName: ravenroot-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ravenroot-data
  labels:
    app.kubernetes.io/name: ravenroot
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ravenroot
  labels:
    app.kubernetes.io/name: ravenroot
spec:
  selector:
    app.kubernetes.io/name: ravenroot
  ports:
    - name: http
      port: 8080
      targetPort: http
