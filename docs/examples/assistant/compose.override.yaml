services:
  ravenroot:
    environment:
      RAVENROOT_ASSISTANT_PROVIDER: ${RAVENROOT_ASSISTANT_PROVIDER:?set assistant provider}
      RAVENROOT_ASSISTANT_ENDPOINT: ${RAVENROOT_ASSISTANT_ENDPOINT:?set assistant endpoint}
      RAVENROOT_ASSISTANT_MODEL: ${RAVENROOT_ASSISTANT_MODEL:?set assistant model}
      RAVENROOT_ASSISTANT_ALLOWED_HOSTS: ${RAVENROOT_ASSISTANT_ALLOWED_HOSTS:?set assistant host}
      RAVENROOT_ASSISTANT_ALLOWED_PORTS: ${RAVENROOT_ASSISTANT_ALLOWED_PORTS:?set assistant port}
      RAVENROOT_ASSISTANT_ALLOW_LOCAL_HTTP: ${RAVENROOT_ASSISTANT_ALLOW_LOCAL_HTTP:-false}
      RAVENROOT_EGRESS_RESERVED_EXCEPTIONS: ${RAVENROOT_EGRESS_RESERVED_EXCEPTIONS:-localhost:LOOPBACK}
