services:
  ravenroot:
    environment:
      RAVENROOT_AUTH_MODE: oidc
      RAVENROOT_AUTH_ISSUER: ${RAVENROOT_AUTH_ISSUER:?set the operator-managed issuer}
      RAVENROOT_AUTH_AUDIENCE: ${RAVENROOT_AUTH_AUDIENCE:?set the service audience}
      RAVENROOT_RUNNER_CONFIG: /etc/ravenroot/runner-plane.json
    volumes:
      - type: bind
        source: ${RAVENROOT_RUNNER_CONFIG_FILE:?set an operator-owned configuration file}
        target: /etc/ravenroot/runner-plane.json
        read_only: true
# Keep artifactDirectory under /opt/ravenroot/data/runner-artifacts in the mounted file.
# The base Compose data volume owns that directory; it is never mounted into a job container.
# Run RunnerWorkerMain on its separately trusted Docker host, not inside the control-plane service.
