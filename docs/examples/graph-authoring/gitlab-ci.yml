# Copy into the graph repository as .gitlab-ci.yml and configure the protected variables below.
# Release-branch protection and merge approvals are operator-owned prerequisites.
stages: [publish]

publish-reviewed-graph:
  stage: publish
  image: python:3.12-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $GRAPH_RELEASE_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      changes: ['graphs/**/*.graphml']
    - when: never
  # Serialize publication/catalog advancement for this repository.
  resource_group: graph-publication
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: "1"
  script:
    - apt-get update && apt-get install --yes --no-install-recommends git ca-certificates
    - pip install --no-cache-dir awscli
    # RAVENROOT_TOOLING_COMMIT is a protected full SHA of the reviewed tooling version.
    - 'test "${#RAVENROOT_TOOLING_COMMIT}" = 40'
    - 'case "$RAVENROOT_TOOLING_COMMIT" in *[!0-9a-f]*) exit 1 ;; esac'
    - git init .ravenroot-tooling
    - git -C .ravenroot-tooling remote add origin https://github.com/ravenroot-ai/ravenroot.git
    - git -C .ravenroot-tooling fetch --depth=1 origin "$RAVENROOT_TOOLING_COMMIT"
    - git -C .ravenroot-tooling checkout --detach "$RAVENROOT_TOOLING_COMMIT"
    - >-
      python3 .ravenroot-tooling/scripts/publish-graph-artifacts.py "$GRAPH_DOCUMENT"
      --tenant "$RAVENROOT_TENANT"
      --source-commit "$CI_COMMIT_SHA"
      --admission-url "$RAVENROOT_ADMISSION_URL"
      --s3-bucket "$GRAPH_ARTIFACT_BUCKET"
      --previous-catalog-url "$PREVIOUS_GRAPH_CATALOG_URL"
      --catalog-path "catalogs/${CI_COMMIT_SHA}.json"

# Protected/masked variables: RAVENROOT_ADMISSION_TOKEN and short-lived AWS credentials
# (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN), plus AWS_DEFAULT_REGION.
# Prefer runner/workload identity for AWS credentials. Never expose them to MR pipelines.
# Configure GRAPH_RELEASE_BRANCH, GRAPH_DOCUMENT, RAVENROOT_TENANT, RAVENROOT_ADMISSION_URL,
# GRAPH_ARTIFACT_BUCKET, PREVIOUS_GRAPH_CATALOG_URL and RAVENROOT_TOOLING_COMMIT as protected.
# Omit --previous-catalog-url only for the first publication in a new store. Advance the
# configured immutable catalog snapshot after success. Conditional object creation refuses
# replacement; retries verify bytes. Registration/import remains a separate stopped lifecycle.
