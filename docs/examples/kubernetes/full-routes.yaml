# Existing Gateway must allow routes from this namespace and have certificates for both hosts.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: ravenroot}
spec:
  parentRefs:
    - {name: public-https, namespace: gateway-system, sectionName: https}
  hostnames: [ravenroot.example.test]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - {name: ravenroot, port: 8080}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: keycloak}
spec:
  parentRefs:
    - {name: public-https, namespace: gateway-system, sectionName: https}
  hostnames: [identity.example.test]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - {name: keycloak, port: 8080}
