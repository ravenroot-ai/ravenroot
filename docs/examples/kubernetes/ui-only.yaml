# Release target 0.7.0-alpha.1: resolve its published digest before applying.
apiVersion: apps/v1
kind: Deployment
metadata: {name: ravenroot-ui}
spec:
  replicas: 1
  selector:
    matchLabels: {app: ravenroot-ui}
  template:
    metadata:
      labels: {app: ravenroot-ui}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {kubernetes.io/arch: amd64}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: ui
          image: ghcr.io/ravenroot-ai/ravenroot-ui:0.7.0-alpha.1
          env:
            - {name: RAVENROOT_UI_PREFIX, value: /ravenroot}
            - {name: RAVENROOT_UI_BACKEND_URL, value: "http://existing-backend.application.svc.cluster.local:8080/automation"}
          ports: [{name: http, containerPort: 8080}]
          startupProbe:
            httpGet: {path: /health, port: http}
            failureThreshold: 12
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /ready, port: http}
          livenessProbe:
            httpGet: {path: /health, port: http}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: "1", memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata: {name: ravenroot-ui}
spec:
  selector: {app: ravenroot-ui}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: ravenroot-ui}
spec:
  parentRefs:
    - {name: public-https, namespace: gateway-system, sectionName: https}
  hostnames: [application.example.test]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /ravenroot}
      # Preserve prefix. Configure SSE buffering/timeouts in the chosen Gateway controller.
      backendRefs:
        - {name: ravenroot-ui, port: 8080}
